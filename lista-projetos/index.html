<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Projetos</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="cabecalho-principal" style="justify-content: space-between;">
            <h1>Projetos</h1>
            <button class="btn btn-primary"><i class="fas fa-plus"></i> Criar Projeto</button>
        </header>

        <div class="lista-projetos">
            
            <div class="card-do-projeto">
                <h2>Website Redesign</h2>
                <p class="descriçao-do-projeto-card">Renovação completa do website corporativo</p>
                
                <div class="projeto-meta">
                    <span class="info-issues">
                        <span class="issues-count">2 issues</span> 
                        <span class="issues-status status-open-count">2 abertas</span>
                    </span>
                    
                    <div class="actions-do-card">
                        <button class="icon-btn" title="Editar Projeto"><i class="fas fa-pencil-alt"></i></button>
                        <a href="/tela-redesign/index.html" class="btn btn-primary btn-sm">Ver Issues</a> 
                    </div>
                </div>
            </div>

            <div class="card-do-projeto">
                <h2>API REST V2</h2>
                <p class="descriçao-do-projeto-card">Nova versão da API com melhor performance</p>
                
                <div class="projeto-meta">
                    <span class="info-issues">
                        <span class="issues-count">1 issues</span> 
                        <span class="issues-status status-open-count">1 aberta</span>
                        <span class="issues-status status-blocked">1 bloqueada</span>
                    </span>

                    <div class="actions-do-card">
                        <button class="icon-btn" title="Editar Projeto"><i class="fas fa-pencil-alt"></i></button>
                        <a href="api-rest-v2.html" class="btn btn-primary btn-sm">Ver Issues</a>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
